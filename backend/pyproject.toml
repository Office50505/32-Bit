[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provenancelab-api"
version = "0.1.0"
description = "Deterministic molecular validation API for ProvenanceLab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pillow==12.3.0",
  "pypdf==6.21.2",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "rdkit==2026.9.1",
  "reportlab==4.5.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
