[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenancelab-api"
version = "0.1.0"
description = "Deterministic molecular validation API for ProvenanceLab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "openai>=2.8,<3",
  "pillow>=11,<13",
  "pypdf>=6,<7",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "rdkit>=2025.3.1",
  "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
